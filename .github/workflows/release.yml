name: Build & Release Portable Windows (.exe)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'
    branches:
      - 'release-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable (PyInstaller)
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "PyKLine-Studio" `
            --add-data "database;database" `
            --add-data "gui;gui" `
            --add-data "core;core" `
            main.py

      - name: Package Assets & Calculate Checksums
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag_name }}"
          $refName = $env:GITHUB_REF_NAME
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { 
            $refName 
          } elseif ($refName -match '^release-(v.+)$') {
            $matches[1]
          } elseif ($inputTag -ne '') { 
            $inputTag 
          } else { 
            'v1.0.0' 
          }
          $zipName = "PyKLine-Studio_${tag}_Windows_x64.zip"
          Compress-Archive -Path "dist/PyKLine-Studio.exe" -DestinationPath $zipName
          Get-FileHash -Algorithm SHA256 $zipName, "dist/PyKLine-Studio.exe" | Format-Table -AutoSize | Out-File -FilePath checksums.txt
          echo "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV
          echo "TAG_NAME=$tag" >> $env:GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          files: |
            ${{ env.RELEASE_ZIP }}
            dist/PyKLine-Studio.exe
            checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
