name: Build & Release Portable Windows (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable (PyInstaller)
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "PyKLine-Studio" `
            --add-data "database;database" `
            --add-data "gui;gui" `
            --add-data "core;core" `
            main.py

      - name: Package Assets & Calculate Checksums
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'latest' }
          $zipName = "PyKLine-Studio_${tag}_Windows_x64.zip"
          Compress-Archive -Path "dist/PyKLine-Studio.exe" -DestinationPath $zipName
          Get-FileHash -Algorithm SHA256 $zipName, "dist/PyKLine-Studio.exe" | Format-Table -AutoSize | Out-File -FilePath checksums.txt
          echo "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            ${{ env.RELEASE_ZIP }}
            dist/PyKLine-Studio.exe
            checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
